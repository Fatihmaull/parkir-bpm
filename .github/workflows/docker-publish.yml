name: Docker Publish

# CD: build image tiap service & push ke GitHub Container Registry (ghcr.io) saat push ke main
# atau saat rilis tag v*. Deploy ke DigitalOcean (droplet/Managed PG) dilakukan terpisah dengan
# kredensial klien — lihat docs/RUNBOOK.md.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: edge-api
            context: services/edge-api
          - name: cloud-api
            context: services/cloud-api
          - name: lpr-svc
            context: services/lpr-svc
          - name: dashboard-web
            context: apps/dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
