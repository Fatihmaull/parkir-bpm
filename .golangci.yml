# Konfigurasi golangci-lint dipakai kedua modul Go (working-directory diset di CI).
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosimple
    - errcheck
    # misspell sengaja TIDAK dipakai: komentar & pesan berbahasa Indonesia (mis. "operasional",
    # "implementasi") dianggap salah eja oleh locale en-US.

linters-settings:
  errcheck:
    # Error yang sengaja diabaikan sudah ditandai `_ =`; abaikan pola tulis-ke-stream & Close.
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (*github.com/gofiber/fiber/v2.Ctx).JSON
      - (*github.com/gofiber/fiber/v2.Ctx).SendString

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
