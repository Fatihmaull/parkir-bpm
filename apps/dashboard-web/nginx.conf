# SPA: fallback ke index.html. Proxy /api & WebSocket ke edge-api diatur saat deploy
# (env EDGE_API_UPSTREAM). Contoh blok proxy disertakan — sesuaikan host saat produksi.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aktifkan saat edge-api berada di jaringan yang sama:
    # location /api/ {
    #     proxy_pass http://edge-api:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}
